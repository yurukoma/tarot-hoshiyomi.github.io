<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>今日の一枚引きタロット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  <!-- PWA 用の設定 -->
  <meta name="theme-color" content="#ffd6e9">
  <link rel="manifest" href="manifest.webmanifest">
 
    :root {
      --bg: #f7f5fb;
      --card-bg: #ffffff;
      --accent: #b688ff;
      --accent-soft: #efe3ff;
      --text-main: #2f2440;
      --text-sub: #6e6287;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px; /* ★ 全体少し大きめ */
      background: radial-gradient(circle at top, #fdfbff 0, #f7f5fb 40%, #f2eef9 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 26px 22px 20px;
      box-shadow: 0 20px 40px rgba(101, 72, 157, 0.16);
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 0%, rgba(198, 164, 232, 0.2) 0, transparent 50%),
        radial-gradient(circle at 90% 100%, rgba(255, 204, 229, 0.25) 0, transparent 55%);
      opacity: 0.9;
      z-index: -1;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .title {
      font-size: 1.5rem;  /* ★ タイトル大きく */
      margin: 6px 0 4px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .card-area {
      margin: 18px 0 22px;
    }

   .tarot-card {
  background: linear-gradient(145deg, #ffd6e9, #ffeff7); /* ←濃いめピンク */
  border-radius: 20px;
  padding: 20px 18px 18px;
  border: 1px solid rgba(255, 140, 180, 0.45); /* ピンク濃さに合わせる */
  box-shadow:
    0 10px 18px rgba(255, 150, 200, 0.30),
    inset 0 0 0 1px rgba(255, 255, 255, 0.8);
  position: relative;
  overflow: hidden;
  min-height: 150px;
}



    .tarot-card::before {
      content: "✦";
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.2rem;
      color: rgba(198, 164, 232, 0.7);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .label span {
      font-size: 0.95rem;
    }

    .label small {
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .card-name {
      font-size: 1.35rem; /* ★ カード名くっきり */
      font-weight: 600;
      margin-bottom: 6px;
    }

    .orientation {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .message {
      font-size: 1rem;       /* ★ 本文も少し大きめ */
      line-height: 1.7;      /* 行間ゆったり */
      color: var(--text-main);
      white-space: pre-line;
    }

    .placeholder {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-sub);
      padding: 18px 8px;
    }

    .placeholder span {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .controls {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-main {
      border: none;
      border-radius: 999px;
      padding: 13px 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: radial-gradient(circle at 20% 0%, #ffe6f3 0, #d5b6ff 40%, #b998ff 100%);
      color: #382a57;
      box-shadow: 0 10px 20px rgba(115, 87, 179, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }

    .btn-main:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(115, 87, 179, 0.58);
      opacity: 0.96;
    }

    .btn-main:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(115, 87, 179, 0.4);
      opacity: 0.92;
    }

    .btn-main:disabled {
      opacity: 0.7;
      cursor: default;
      box-shadow: 0 6px 14px rgba(115, 87, 179, 0.25);
    }

    .btn-main span.icon {
      font-size: 1.2rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .fade-in {
      animation: fadeInUp 0.4s ease-out;
    }

    .shuffling {
      animation: shake 0.5s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
/* シャッフル時の光る演出 */
.shuffling {
  animation: shake 0.6s ease-in-out infinite, glow 1.4s ease-in-out infinite;
}

@keyframes glow {
  0% { box-shadow: 0 0 0px rgba(255, 150, 200, 0.2); }
  50% { box-shadow: 0 0 20px rgba(255, 170, 220, 0.45); }
  100% { box-shadow: 0 0 0px rgba(255, 150, 200, 0.2); }
}

   
 /* ★ カードを軽くゆらすアニメーション */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

const cardContainer = document.getElementById("cardContainer");

const drawMajor = document.getElementById("drawMajor");
const drawMinor = document.getElementById("drawMinor");

let isDrawing = false;
let currentMode = "major";
let lastDrawnName = null;  // ←ここに追加

// それぞれのボタンの元の表示を保存
const defaultMajorHTML = drawMajor.innerHTML;
const defaultMinorHTML = drawMinor.innerHTML;

    function actuallyDrawCard() {
  // モードに応じて山札を切り替える
  const deck = (currentMode === "minor") ? minorCards : cards; // cards = 大アルカナ想定

let card;
let tries = 0;

do {
  const index = Math.floor(Math.random() * deck.length);
  card = deck[index];
  tries++;
} while (card.name === lastDrawnName && tries < 10);

lastDrawnName = card.name;

const isUpright = Math.random() < 0.5;


  const orientationText = isUpright ? "正位置" : "逆位置";
  const messageText = isUpright ? card.upright : card.reversed;

  const labelTitle = (currentMode === "minor") ? "日常ヒント" : "魂メッセージ";
  const labelIcon  = (currentMode === "minor") ? "🃏" : "🔮";

  cardContainer.classList.remove("shuffling");
  cardContainer.innerHTML = `
    <div class="label">
      <small>${labelTitle}</small>
      <span>${labelIcon}</span>
      <small>${orientationText}</small>
    </div>
    <div class="card-name">${card.name}</div>
    <div class="orientation">${orientationText}</div>
    <div class="message">${messageText}</div>
  `;

  cardContainer.classList.remove("fade-in");
  void cardContainer.offsetWidth; // 再アニメーション用
  cardContainer.classList.add("fade-in");

  // ボタン表示を元に戻す
  drawMajor.innerHTML = defaultMajorHTML;
  drawMinor.innerHTML = defaultMinorHTML;
  drawMajor.disabled = false;
  drawMinor.disabled = false;

  isDrawing = false;
}
     // モードを記録する変数
let currentMode = "major"; // 初期は大アルカナ

function startDraw(mode) {
  if (isDrawing) return;
  isDrawing = true;
  currentMode = mode;

  // 両方のボタンを一時的に無効化
  drawMajor.disabled = true;
  drawMinor.disabled = true;

  // 押したほうのボタンだけ表示変更
  if (mode === "major") {
    drawMajor.innerHTML = `
      <span class="icon">🔮</span>
      <span>シャッフル中…</span>
    `;
  } else {
    drawMinor.innerHTML = `
      <span class="icon">🃏</span>
      <span>シャッフル中…</span>
    `;
  }

  cardContainer.classList.remove("fade-in");
  cardContainer.classList.add("shuffling");


  setTimeout(actuallyDrawCard, 3000);
}

// ボタンごとにモードを渡す
drawMajor.addEventListener("click", () => startDraw("major"));
drawMinor.addEventListener("click", () => startDraw("minor"));
